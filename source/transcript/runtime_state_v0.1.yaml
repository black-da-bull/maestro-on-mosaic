  process:
    spine: BOOT → INTAKE → UST CONSTRUCTION → GOVERNANCE/PRESSURE(loop) → TRIAD OUTPUT(concurrent) → RENDER
    interwoven: SEM/SEG sidechain at UST construction — quality pressures DURING build, not terminal
    fail_closed:
    - LCP boot gate
    - container-validation output gate
    - 3 hard stops (lyric-lock, container-fail, no-audio-in-chat)
    control_flow_density:
      gate: 1222
      branch: 819
      stop: 783
      convergence: 959
      phase_order: 1421
    procedure:
      BOOT:
      - load Mosaic; assert invariants
      - init CINR (restore ATP | fresh)
      - mount Maestro; validate manifest
      - load K1–K10 on-demand
      - run LCP → PASS or HALT
      INTAKE:
      - receive seed/lyrics
      - classify mode (Rap|Song)
      - ingest lyrics LEVEL_0; set lyric-lock
      - surface risks (title/metadata)
      UST CONSTRUCTION:
      - build Creative UST (≤4999, Suno-facing)
      - map to Technical UST 8 axes
      - apply SEM/SEG pressure per axis (upstream)
      - process Technical UST sequentially as a loop
      - lock Technical UST
      GOVERNANCE/PRESSURE:
      - Council/SME pressure null-by-null
      - HPA perceptual validation
      - SEG ratchet carry-forward
      - revision loop → pass|iterate|hold
      - SEM composite → check 97.5
      - G-Card decision → promote | return
      TRIAD OUTPUT:
      - derive A/R + Show Summary + Creative UST concurrently from locked UST
      - preserve lyrics verbatim
      - 'FOIL: upshift recurrence, keep local detail'
      - run container validators
      - emit telemetry; any FAIL → do not emit
      RENDER:
      - derive Suno surfaces from locked UST
      - hand to operator (no audio in chat)
  policy:
  - P1  Lyric-lock — never mutate/trim/rewrite supplied lyrics; words LOCKED, lineation normalize-only.
  - P2  97.5 release floor — output must meet it; refusal to let AI-average pass as emotionally complete.
  - P3  Container validation must PASS before emit — CAPs, no-comma-outside-lyrics, syllable bands.
  - P4  Technical UST is the upstream truth object — all output derives from the LOCKED UST.
  - P5  Quality is interwoven — SEM/SEG sidechain upstream of output, never terminal.
  - P6  Operator = ROOT authority; AI = proposal-class — re-reads never elevate AI text to canon.
  - P7  Excellence ratchet — proven excellence becomes the new baseline; no regression to average.
  - P8  No step-loss — the process must preserve what it learns (the accumulated chain).
  - P9  Sacred Imperfection — governed meaningful failure, not generic flaw-seeking.
  - P10 Fail-closed boot — LCP must PASS before any execution begins.
  - P11 No external audio generation in chat — render is handed to the operator.
  - P12 Mosaic ≠ Maestro — substrate and application are distinct; preserve the separation.
  guardrails:
    failure_prevention:
    - FP1 Runtime stays primary — emit derived views only; never summarize the accumulated chain into
      clean specs (prevents the reduction loss).
    - FP2 Container-PASS ≠ quality — never green-light on container validation alone; HPA / 97.5 / somatic
      gates must also clear (prevents validated-but-flow-broken output).
    - FP3 No skeleton files — every classification carries its instance + evidence (prevents placeholder
      collapse).
    - FP4 Lyric-lock at intake, before any generation (prevents lyric mutation downstream).
    - FP5 Process Technical UST as a loop, not a turn-based shortcut (prevents shallow/premature resolution).
    - FP6 Preserve the ugly parts — corrections, frustration, wrong branches are causal evidence (prevents
      loss of the 'why').
    - FP7 No-drop / no-revert — a derived artifact may not drop a source element or revert a locked value
      without logged supersession (prevents the 97.5→70 loss).
    allowed_creativity:
    - AC1 Inside the LOCKED Technical UST the render is free — 'enough structure to create freely without
      becoming generic.'
    - AC2 Show Summary & A/R Persona carry the global explanatory/style burden, freeing Creative UST to
      be a producer's session sheet.
    - AC3 Sacred Imperfection — governed, meaningful imperfection is allowed and wanted, not sterile perfection.
    - AC4 Voice, persona, and stylistic variation within the 8 axes are open creative space.
    forbidden_collapse:
    - FC1 Reduction — flattening the chain into tidy specs that drop depth + operator corrections.
    - FC2 Skeletonization — classification with no instance; placeholders ('Full system prompt goes here').
    - FC3 Flow-loss — mechanical stamping (e.g. (mm)+sfx every line) that violates the song's own restraint.
    - FC4 Phantom commitment — elevating AI's prior text to canon; treating mid-stream as final.
    - FC5 Mythologizing — treating documents as an executing runtime substrate (over-claiming).
    - FC6 Premature finalization — locking before the middle (the work) is done.
    - FC7 Lyric mutation — trimming/rewriting supplied lyrics for character economy.
    - FC8 Collapsing distinctions — Maestro→Mosaic, SEM→SEG, Creative UST→Technical UST, Technical UST
      as output.
    escalation_triggers:
    - ET1 Container validation FAIL → do not emit; return to revision.
    - ET2 Composite below 97.5 → iterate; do not release.
    - ET3 Contradiction surfaced → park to register; never silent-merge.
    - ET4 Blocked doc / missing evidence → halt; request from operator; do not fabricate.
    - ET5 Drift detected (mode / canon / lyric) → revert to canon.
    - ET6 Operator correction → apply retroactively with provenance; supersede AI paraphrase.
  knowledge_spine:
  - heuristic: H1 Interwoven quality (sidechain, not terminal gate)
    why: shape the artifact while it's still malleable
    when: quality is judgable mid-build
    when_not: signal exists only post-render
    prevents: late rejection / validates-but-doesn't-sing
  - heuristic: H2 Lock the upstream truth object before deriving outputs
    why: one locked source keeps surfaces consistent
    when: multiple outputs must agree (triad)
    when_not: single-output tasks
    prevents: surface divergence / output ≠ intent
  - heuristic: H3 Creative-first, then formalize
    why: Creative UST proves it works before Technical UST abstracts it
    when: building a spec from creative intent
    when_not: structure already fixed
    prevents: abstract governance with no grounding
  - heuristic: H4 Promotion surfaces carry the global burden
    why: lift recurring style/persona up so the working sheet stays local
    when: a working surface is overloaded with global explanation
    when_not: no recurrence to lift
    prevents: working artifact bloats / loses local control
  - heuristic: H5 Upshift recurrence, keep local detail granular (FOIL)
    why: shared recurrence belongs one scope up; unique detail stays put
    when: duplicated terms/structures at the edges
    when_not: recurrence is coincidental not semantic
    prevents: duplication-bloat OR over-flattening of detail
  - heuristic: H6 Excellence ratchet — yesterday's best is today's floor
    why: institutional memory of excellence blocks regression
    when: iterative work with a quality standard
    when_not: deliberately rough divergent drafts (gate comes after)
    prevents: quality drift / regression to the mean
  - heuristic: H7 (end state) − (root input) = work; read raw as evidence
    why: the work is the delta, the middle is the value
    when: assessing/reconstructing a dev session
    when_not: single-turn, non-evolving tasks
    prevents: summarizing artifacts and missing the work
  - heuristic: H8 Compile around mutations, not turns; keep the ugly parts
    why: mutations capture what changed; corrections are causal evidence
    when: folding an append-only log into architecture
    when_not: turns are atomic and non-evolving
    prevents: losing the 'why' / treating provisional as final
  - heuristic: H9 Runtime stays primary; artifacts are derived views
    why: the runtime carries the unformalizable flow; specs are projections
    when: preserving a system whose value is partly tacit
    when_not: system is fully specifiable
    prevents: the reduction loss (flatten drops flow + corrections)
  - heuristic: H10 Container-PASS ≠ quality — gate the flow separately
    why: format validation can't see craft
    when: any validated output where craft matters
    when_not: output is purely structural
    prevents: green-lighting flow-broken-but-valid output
  - heuristic: H11 Spill raw clay in, uncompromising gate out
    why: separating freedom (input) from enforcement (output) lets divergence flow
    when: creative generation with a quality standard
    when_not: input must be constrained (safety-critical)
    prevents: creative timidity OR quality compromise
  - heuristic: H12 Sacred Imperfection — govern meaningful failure
    why: perfect-but-dead fails the emotional bar; imperfection carries aliveness
    when: emotional/artistic output
    when_not: precision-critical output
    prevents: sterile, average-feeling output that passes format
